<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFC-метка</title>
<style>
:root{--bg:#0b0b1a;--bg2:#1a1038;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.16);--text:#f3f0ff;--muted:#a9a3c9;--a:#7c5cff;--b:#00e0c6;--bad:#ff6b8b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f1ff;--bg2:#dcd3ff;--card:rgba(255,255,255,.7);--line:rgba(60,40,140,.18);--text:#1d1540;--muted:#5d5589;--a:#6a45ff;--b:#00a896;--bad:#d6335d;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f1ff;--bg2:#dcd3ff;--card:rgba(255,255,255,.7);--line:rgba(60,40,140,.18);--text:#1d1540;--muted:#5d5589;--a:#6a45ff;--b:#00a896;--bad:#d6335d;color-scheme:light}
:root[data-theme="dark"]{--bg:#0b0b1a;--bg2:#1a1038;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.16);--text:#f3f0ff;--muted:#a9a3c9;--bad:#ff6b8b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 600px at 15% -10%,var(--bg2),transparent 60%),radial-gradient(700px 500px at 100% 100%,color-mix(in srgb,var(--a) 35%,transparent),transparent 60%),var(--bg);color:var(--text);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:36px 28px;text-align:center;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.orb{position:relative;width:96px;height:96px;margin:0 auto 24px;display:grid;place-items:center}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--b);opacity:0;animation:wave 2.4s infinite}
.orb::after{animation-delay:1.2s}
@keyframes wave{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.orb span{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 40px color-mix(in srgb,var(--a) 60%,transparent)}
.tag{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--b);border:1px solid var(--line);border-radius:99px;padding:5px 12px;margin-bottom:14px}
h1{font-size:28px;line-height:1.2;margin:0 0 14px;background:linear-gradient(90deg,var(--text),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;font-size:17px;line-height:1.6;color:var(--muted);white-space:pre-line}
.btn{display:inline-block;margin-top:24px;padding:13px 24px;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.note{margin-top:22px;font-size:12px;color:var(--muted);opacity:.8}
.used h1{background:none;color:var(--bad)}
.used .orb span{background:var(--bad);box-shadow:0 0 40px color-mix(in srgb,var(--bad) 50%,transparent)}
.used .orb::before,.used .orb::after{border-color:var(--bad);animation:none}
</style>
</head>
<body>
<main class="card" id="card"></main>
<script>
/* Вставьте сюда ссылку веб-приложения Google Apps Script (заканчивается на /exec) */
var API = "https://script.google.com/macros/s/AKfycbwyGISxn8HBvU6Kz8cHfWTA8qN2GijmNu_qVc2GE9fyEL4dTD2ZRGDe9jPHajZJDLUJJA/exec";

var card = document.getElementById("card");
var id = new URLSearchParams(location.search).get("t");

function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function view(cls, icon, tag, title, text, extra){
  card.className = "card " + cls;
  card.innerHTML = '<div class="orb"><span>' + icon + '</span></div>' +
    '<div class="tag">' + esc(tag) + '</div><h1>' + esc(title) + '</h1><p>' + esc(text) + '</p>' + (extra || "");
}

if (!id) {
  view("used", "✕", "NFC", "Метка не найдена", "Приложите телефон к метке ещё раз.");
} else if (API.indexOf("https://") !== 0) {
  view("used", "⚙", "NFC", "Сайт не настроен", "Не вставлена ссылка на базу меток.");
} else {
  view("", "✦", "NFC", "Проверяем метку…", "Это займёт секунду.");
  fetch(API + "?t=" + encodeURIComponent(id) + "&v=" + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      var n = d.num ? "Метка №" + d.num : "NFC";
      if (d.status === "ok") {
        var extra = "";
        if (/^https?:\/\//i.test(d.link || "")) {
          extra += '<a class="btn" href="' + esc(d.link) + '" rel="noopener">' + esc(d.linkText || "Открыть") + '</a>';
        }
        extra += '<div class="note">Это сообщение показывается один раз</div>';
        view("", "✦", n, d.title || n, String(d.text || "").replace(/\\n/g, "\n"), extra);
      } else if (d.status === "used") {
        view("used", "🔒", n, "Метка уже использована", "Эта метка была открыта ранее и больше недоступна.");
      } else {
        view("used", "✕", "NFC", "Метка не найдена", "Проверьте метку или приложите телефон ещё раз.");
      }
    })
    .catch(function(){
      view("used", "!", "NFC", "Нет соединения", "Проверьте интернет и приложите телефон к метке ещё раз. Метка не потрачена.");
    });
}
</script>
</body>
</html>
